name: Apply bundled runtime discovery fix
on:
  push:
    branches: [fix/red-l2-bundled-runtime-discovery]
    paths:
      - .github/workflows/apply-bundled-runtime-discovery-fix.yml
      - scripts/fix-bundled-runtime-discovery.py
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/fix-bundled-runtime-discovery.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/curriculum/authoritative-published.ts
          git diff --cached --quiet || git commit -m "Discover bundled curriculum lessons at runtime"
          git push
