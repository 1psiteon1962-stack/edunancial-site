name: Apply runtime course discovery fix
on:
  push:
    branches: [fix/end-to-end-curriculum-publication]
    paths:
      - scripts/fix-runtime-course-discovery.py
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/fix-runtime-course-discovery.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/curriculum/authoritative-published.ts
          git diff --cached --quiet || git commit -m "Discover merged canonical curriculum at runtime"
          git push
