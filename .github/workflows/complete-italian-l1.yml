name: Complete unified L1 translations
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/complete-italian-l1.yml
      - scripts/international/generate-locale-l1.mjs
permissions:
  contents: write
  models: read
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate complete Level 1 assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/international/generate-locale-l1.mjs all
      - name: Generate localization manifest
        run: npm run curriculum:localization:global
      - name: Enforce complete Level 1 localization
        run: npm run curriculum:localization:l1-gate
      - name: Commit generated translations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          git diff --cached --quiet || git commit -m "Complete unified Level 1 translations"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
