name: Complete unified L1 translations
on:
  workflow_dispatch:
    inputs:
      locale:
        description: "Locale to translate (for example: it, de, es-ES) or all"
        required: false
        default: "nl"
      track:
        description: "Optional track/color for a canary run (for example: PURPLE)"
        required: false
        default: "BLUE"
      lesson:
        description: "Optional lesson number or ID for a canary run (for example: 1 or PURPLE-L1-001)"
        required: false
        default: ""
      force:
        description: "Regenerate even if a localized file already exists"
        required: false
        default: "false"
  push:
    branches: [translate/blue-l1-nl-001-050]
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/complete-italian-l1.yml
      - scripts/international/generate-locale-l1.mjs
permissions:
  contents: write
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OPENAI_ORGANIZATION: org-5Mmp9o6SiLOFDfUWbzF7xoPI
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate translator script on pull requests
        if: github.event_name == 'pull_request'
        run: node --check scripts/international/generate-locale-l1.mjs
      - name: Require translation provider credential
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY repository/environment secret is required."
            exit 78
          fi
      - name: Verify funded OpenAI organization and usable API credit
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EDUNANCIAL_TRANSLATION_MODEL: ${{ vars.EDUNANCIAL_TRANSLATION_MODEL }}
        run: |
          node - <<'NODE'
          const key=process.env.OPENAI_API_KEY?.trim();
          const org=process.env.OPENAI_ORGANIZATION?.trim();
          const model=process.env.EDUNANCIAL_TRANSLATION_MODEL?.trim()||"gpt-4.1-mini";
          const headers={"Authorization":`Bearer ${key}`,"Content-Type":"application/json"};
          if(org) headers["OpenAI-Organization"]=org;
          const res=await fetch("https://api.openai.com/v1/chat/completions",{
            method:"POST",
            headers,
            body:JSON.stringify({
              model,
              messages:[{role:"user",content:"Reply with exactly OK"}],
              max_tokens:2,
              temperature:0
            })
          });
          const body=await res.text();
          if(!res.ok){
            console.error(`OpenAI preflight failed: HTTP ${res.status} ${body}`);
            process.exit(1);
          }
          console.log("OpenAI funded-organization preflight passed.");
          NODE
      - name: Generate Level 1 localization
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EDUNANCIAL_TRANSLATION_MODEL: ${{ vars.EDUNANCIAL_TRANSLATION_MODEL }}
          EDUNANCIAL_TRANSLATION_TRACK: BLUE
          EDUNANCIAL_TRANSLATION_LESSON: 
          EDUNANCIAL_TRANSLATION_FORCE: 1
          EDUNANCIAL_TRANSLATION_LOCALE: nl
        run: node scripts/international/generate-locale-l1.mjs "$EDUNANCIAL_TRANSLATION_LOCALE"
      - name: Verify exact BLUE L1 Dutch 50/50
        run: |
          node - <<'NODE'
          const fs=require("fs");
          const dir="content/curriculum/BLUE/L1";
          const files=fs.readdirSync(dir).filter(f=>/^BLUE-L1-\\d{3}\\.nl\\.md$/.test(f));
          if(files.length!==50) throw new Error("Expected 50 Dutch lessons, found "+files.length);
          for(let i=1;i<=50;i++){const f="BLUE-L1-"+String(i).padStart(3,"0")+".nl.md";if(!files.includes(f))throw new Error("Missing "+f);}
          console.log("Verified BLUE L1 Dutch 50/50");
          NODE
      - name: Generate localization manifest
        run: npm run curriculum:localization:global
      - name: Commit generated translations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          git diff --cached --quiet || git commit -m "Generate Level 1 translations"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
