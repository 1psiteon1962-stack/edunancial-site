name: Complete unified L1 translations
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/complete-italian-l1.yml
      - scripts/international/generate-locale-l1.mjs
permissions:
  contents: write
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OPENAI_ORGANIZATION: org-5Mmp9o6SiLOFDfUWbzF7xoPI
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Require translation provider credential
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY repository/environment secret is required."
            exit 78
          fi
      - name: Verify funded OpenAI organization and usable API credit
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EDUNANCIAL_TRANSLATION_MODEL: ${{ vars.EDUNANCIAL_TRANSLATION_MODEL }}
        run: |
          node - <<'NODE'
          const key=process.env.OPENAI_API_KEY?.trim();
          const org=process.env.OPENAI_ORGANIZATION?.trim();
          const model=process.env.EDUNANCIAL_TRANSLATION_MODEL?.trim()||"gpt-4.1-mini";
          const headers={"Authorization":`Bearer ${key}`,"Content-Type":"application/json"};
          if(org) headers["OpenAI-Organization"]=org;
          const res=await fetch("https://api.openai.com/v1/chat/completions",{
            method:"POST",
            headers,
            body:JSON.stringify({
              model,
              messages:[{role:"user",content:"Reply with exactly OK"}],
              max_tokens:2,
              temperature:0
            })
          });
          const body=await res.text();
          if(!res.ok){
            console.error(`OpenAI preflight failed: HTTP ${res.status} ${body}`);
            process.exit(1);
          }
          console.log("OpenAI funded-organization preflight passed.");
          NODE
      - name: Generate complete Level 1 assets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EDUNANCIAL_TRANSLATION_MODEL: ${{ vars.EDUNANCIAL_TRANSLATION_MODEL }}
        run: node scripts/international/generate-locale-l1.mjs all
      - name: Generate localization manifest
        run: npm run curriculum:localization:global
      - name: Enforce complete Level 1 localization
        run: npm run curriculum:localization:l1-gate
      - name: Commit generated translations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          git diff --cached --quiet || git commit -m "Complete unified Level 1 translations"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
