name: Complete Italian L1 translations
on:
  workflow_dispatch:
  push:
    branches: [fix/italian-l1-main-execution]
    paths: [.github/workflows/complete-italian-l1.yml, scripts/international/italian-l1-main-trigger.txt]
permissions:
  contents: write
  models: read
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/italian-l1-main-execution
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate complete Italian Level 1 assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/international/generate-locale-l1.mjs it
      - name: Audit 400 lessons
        run: node scripts/international/italian-l1-400-audit.mjs
      - name: Commit generated translations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content italian-l1-400-audit.json
          git diff --cached --quiet || git commit -m "Complete Italian Level 1 translations"
          git push origin HEAD:fix/italian-l1-main-execution
