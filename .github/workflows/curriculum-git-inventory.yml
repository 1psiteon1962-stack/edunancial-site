name: Curriculum Git file inventory (read-only)
on:
  workflow_dispatch:
  schedule:
    - cron: "41 13 * * *"
permissions:
  contents: read
jobs:
  git-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify inventory preservation and locale hashing
        run: node --test scripts/curriculum/git-file-inventory.test.mjs
      - name: Inventory committed curriculum without mutation
        run: node scripts/curriculum/git-file-inventory.mjs
      - name: Retain per-file hash evidence
        uses: actions/upload-artifact@v4
        with:
          name: git-curriculum-file-inventory-${{ github.run_id }}
          path: reports/curriculum-preservation/git-file-inventory.json
          retention-days: 90
          if-no-files-found: error
