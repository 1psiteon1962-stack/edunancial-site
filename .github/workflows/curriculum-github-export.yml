name: Curriculum canonical Git export queue

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: curriculum-github-export
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  # Signed GitHub OIDC identity; the endpoint verifies repository, branch and workflow file.
  id-token: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Export published packages to Git one at a time
        shell: bash
        env:
          GH_RUN_ID: ${{ github.run_id }}
          OIDC_AUDIENCE: https://edunancial.com/api/admin
        run: |
          set -euo pipefail
          # A fresh short-lived OIDC token is requested for every call, so long runs never use an expired one.
          oidc_token() {
            local token
            token=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              --get --data-urlencode "audience=$OIDC_AUDIENCE" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r '.value // empty')
            if [ -z "$token" ]; then echo "::error::Could not obtain a GitHub OIDC token (id-token: write required)." >&2; return 1; fi
            printf '%s' "$token"
          }
          endpoint="https://edunancial.com/api/admin/content/upload/github-export-next"
          for attempt in $(seq 1 40); do
            token=$(oidc_token)
            echo "::add-mask::$token"
            code=$(curl -sS -o export.json -w '%{http_code}' -X POST "$endpoint" \
              -H "Authorization: Bearer $token" \
              -H "X-GitHub-Run-Id: $GH_RUN_ID" || echo "000")
            cat export.json 2>/dev/null || true; echo
            if [ "$code" = "200" ] && [ -n "$(jq -r '.pullRequestUrl // empty' export.json)" ]; then
              echo "::notice title=Curriculum export PR opened::$(jq -r '"\(.uploadId) -> \(.pullRequestUrl)"' export.json)"
            fi
            if [ "$code" = "200" ]; then
              if [ "$(jq -r '.done // false' export.json)" = "true" ]; then echo "Export queue empty."; exit 0; fi
              sleep 5; continue
            fi
            # A 401 can be transient (GitHub OIDC signing-key rotation or a JWKS fetch timeout
            # on the server). Retry with a fresh token a bounded number of times before failing.
            if [ "$code" = "401" ] && [ "${auth_retries:-0}" -lt 3 ]; then
              auth_retries=$(( ${auth_retries:-0} + 1 ))
              echo "::warning title=Curriculum export auth retry::HTTP 401; retrying with a fresh OIDC token (${auth_retries}/3)."
              sleep $(( 20 * auth_retries )); continue
            fi
            echo "Export stopped on HTTP $code. Learner publication is unaffected; receipt remains retryable."
            # Surface the server's reason through the annotations API (no secrets in this body).
            reason=$(jq -r '[.uploadId // "", .error // "", .permissionHint // ""] | map(select(. != "")) | join(" | ")' export.json 2>/dev/null | head -c 1500 | tr '\n' ' ')
            echo "::error title=Curriculum Git export stopped (HTTP $code)::${reason:-no response body}"
            exit 1
          done
