name: Curriculum canonical Git export queue

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: curriculum-github-export
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  # Signed GitHub OIDC identity; the endpoint verifies repository, branch and workflow file.
  id-token: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Export published packages to Git one at a time
        shell: bash
        env:
          GH_RUN_ID: ${{ github.run_id }}
          OIDC_AUDIENCE: https://edunancial.com/api/admin
        run: |
          set -euo pipefail
          # A fresh short-lived OIDC token is requested for every call, so long runs never use an expired one.
          oidc_token() {
            local token
            token=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              --get --data-urlencode "audience=$OIDC_AUDIENCE" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r '.value // empty')
            if [ -z "$token" ]; then echo "::error::Could not obtain a GitHub OIDC token (id-token: write required)." >&2; return 1; fi
            printf '%s' "$token"
          }
          endpoint="https://edunancial.com/api/admin/content/upload/github-export-next"
          for attempt in $(seq 1 40); do
            token=$(oidc_token)
            echo "::add-mask::$token"
            code=$(curl -sS -o export.json -w '%{http_code}' -X POST "$endpoint" \
              -H "Authorization: Bearer $token" \
              -H "X-GitHub-Run-Id: $GH_RUN_ID" || echo "000")
            cat export.json 2>/dev/null || true; echo
            if [ "$code" = "200" ]; then
              if [ "$(jq -r '.done // false' export.json)" = "true" ]; then echo "Export queue empty."; exit 0; fi
              sleep 5; continue
            fi
            echo "Export stopped on HTTP $code. Learner publication is unaffected; receipt remains retryable."
            exit 1
          done
