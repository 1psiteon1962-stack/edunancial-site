name: Curriculum Integrity

on:
  push:
    paths:
      - 'curriculum/**'
      - 'content/curriculum/**'
      - 'content/courses/**'
      - 'content/registries/**'
      - 'scripts/curriculum/**'
      - 'src/lib/admin-content/**'
      - 'src/lib/curriculum/**'
      - 'docs/curriculum-management.md'
      - 'examples/curriculum-package/**'
      - '.github/workflows/curriculum-integrity.yml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'curriculum/**'
      - 'content/curriculum/**'
      - 'content/courses/**'
      - 'content/registries/**'
      - 'scripts/curriculum/**'
      - 'src/lib/admin-content/**'
      - 'src/lib/curriculum/**'
      - 'docs/curriculum-management.md'
      - 'examples/curriculum-package/**'
      - '.github/workflows/curriculum-integrity.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  curriculum-integrity:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reconcile BLUE Level 1 on recovery branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/recover/blue-l1-after-white' && github.actor != 'github-actions[bot]'
        run: |
          npm run curriculum:import -- content/curriculum/BLUE/L1
          npm run curriculum:audit
          npm run curriculum:inventory
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add curriculum/registry.json curriculum/ingestion-ledger.json curriculum/inventory.json curriculum/reports
          if git diff --cached --quiet; then
            echo "BLUE metadata already reconciled"
          else
            git commit -m "Register BLUE curriculum after WHITE merge"
            git push origin HEAD:recover/blue-l1-after-white
          fi

      - name: Run curriculum unit tests
        run: npm run curriculum:test

      - name: Validate registered curriculum assets
        run: npm run curriculum:validate

      - name: Validate global localization and generate translation manifest
        run: npm run curriculum:localization:global

      - name: Publish global translation manifest
        uses: actions/upload-artifact@v4
        with:
          name: translation-manifest-${{ github.sha }}
          path: content/generated/translation-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Audit registry and filesystem
        run: npm run curriculum:audit

      - name: Generate machine-readable curriculum inventory
        run: npm run curriculum:inventory

      - name: Publish generated curriculum inventory
        uses: actions/upload-artifact@v4
        with:
          name: curriculum-inventory-${{ github.sha }}
          path: curriculum/inventory.json
          if-no-files-found: error
          retention-days: 30

      - name: Ensure audit artifacts are committed
        run: git diff --exit-code -- curriculum/reports/CURRICULUM-AUDIT.json curriculum/reports/CURRICULUM-AUDIT.md

      - name: Lint application
        run: npm run lint

      - name: Typecheck application
        run: npx tsc --noEmit

      - name: Build application
        run: npm run build
