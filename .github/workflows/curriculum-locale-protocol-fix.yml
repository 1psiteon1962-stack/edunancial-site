name: Curriculum locale protocol fix
on:
  push:
    branches: [fix/curriculum-markdown-translation-discovery]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/curriculum-markdown-translation-discovery
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply translation protocol fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lib/curriculum/reader.ts')
          s=p.read_text()
          old='''    const candidatePath = candidateLocale === "en"\n      ? canonicalPath\n      : canonicalPath.replace(/\\.md$/u, `.${candidateLocale}.md`);\n\n    if (candidateLocale !== "en" && !existsSync(candidatePath)) {\n      continue;\n    }\n'''
          new='''    const sidecarPath = candidateLocale === "en"\n      ? canonicalPath\n      : canonicalPath.replace(/\\.md$/u, `.${candidateLocale}.md`);\n    const localeDirectoryNames = candidateLocale === "en"\n      ? []\n      : Array.from(new Set([candidateLocale, candidateLocale.replaceAll("-", "_")]));\n    const canonicalFilename = canonicalPath.split(/[/\\\\]/u).pop() ?? "";\n    const canonicalDirectory = canonicalPath.slice(0, Math.max(0, canonicalPath.length - canonicalFilename.length));\n    const directoryCandidates = localeDirectoryNames.map((localeDirectory) =>\n      join(canonicalDirectory, localeDirectory, canonicalFilename)\n    );\n    const candidatePath = candidateLocale === "en"\n      ? canonicalPath\n      : [sidecarPath, ...directoryCandidates].find((path) => existsSync(path));\n\n    if (!candidatePath) {\n      continue;\n    }\n'''
          if old not in s:
              raise SystemExit('Expected localization block not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Validate
        run: |
          npm ci
          npm run typecheck
          npm test -- --runInBand
      - name: Commit validated fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/curriculum/reader.ts
          git rm .github/workflows/curriculum-locale-protocol-fix.yml
          git commit -m "Fix curriculum locale translation protocol"
          git push origin HEAD:fix/curriculum-markdown-translation-discovery
