name: Ingest Stored Curriculum
on:
  # RETIRED LEGACY PUBLISHER: retained only as an explicit fail-closed marker.
  # Stored curriculum must publish through the admin finalizer -> atomic runtime
  # state -> canonical Git export path. Never publish to content/courses here.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Reject legacy stored-curriculum ingestion
        run: |
          echo "::error::Legacy stored curriculum ingestion is retired."
          echo "::error::Use the admin bulk uploader/finalizer canonical publication path."
          exit 1
