name: Ingest Stored Curriculum
on:
  push:
    branches: [main, admin-content-storage]
  pull_request:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: stored-curriculum-ingest
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # PR runs must test the code being proposed. Storage/schedule runs use main.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
      - name: Fetch storage branch
        run: git fetch origin admin-content-storage:refs/remotes/origin/admin-content-storage
      - name: Ingest stored ZIPs
        env:
          EDUNANCIAL_STORAGE_REF: origin/admin-content-storage
        run: node scripts/curriculum/ingest-stored-zips.mjs
      - name: Validate curriculum
        run: npm run curriculum:validate
      - name: Open publication PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add content/courses .edunancial-admin-content/ingest-ledger.json
          if git diff --cached --quiet -- content/courses .edunancial-admin-content/ingest-ledger.json; then exit 0; fi
          branch="automation/stored-curriculum-ingest"
          git config user.name "edunancial-curriculum-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B "$branch"
          git commit -m "Ingest stored curriculum packages"
          git push --force-with-lease origin "$branch"
          existing_pr="$(gh pr list --base main --head "$branch" --state open --json url --jq '.[0].url // empty')"
          if [ -n "$existing_pr" ]; then
            echo "Publication PR already exists: $existing_pr"
            exit 0
          fi

          if ! pr_url="$(gh pr create --base main --head "$branch" --title "Ingest stored curriculum packages" --body "Repository-authoritative ingestion from admin-content-storage. Validated before publication.")"; then
            echo "::error::Curriculum files were validated and preserved on branch $branch, but GitHub Actions could not create the publication PR."
            echo "::error::Enable Settings > Actions > General > Workflow permissions > Allow GitHub Actions to create and approve pull requests, or create the PR from $branch to main manually."
            exit 1
          fi

          echo "Publication PR created: $pr_url"
          echo "Auto-merge is intentionally not attempted here because repository auto-merge is disabled. Required checks must pass before merge."
