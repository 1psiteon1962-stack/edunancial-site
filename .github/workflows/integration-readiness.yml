name: Integration Readiness

on:
  pull_request:
    branches:
      - main
      - release/rc1-integration
  push:
    branches:
      - fix/integration-readiness
      - release/rc1-integration

permissions:
  contents: read

# The retired Netlify context `netlify/edunancial-site/deploy-preview` is
# intentionally NOT part of this repository-controlled readiness gate.
# The authoritative Netlify project is `edunancial`; GitHub branch protection
# requires the `Build` check produced below. This workflow does not enumerate
# or fail on unrelated external status contexts, so the retired context cannot
# block the repository-controlled Build gate.
#
# Diagnostic runner pin: recent jobs have failed before "Set up job" executes.
# Pinning a known stable GitHub-hosted image tests runner allocation without
# weakening any validation step.
jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build production application
        run: npm run build
