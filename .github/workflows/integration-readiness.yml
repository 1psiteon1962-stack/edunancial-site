name: Integration Readiness

on:
  pull_request:
    branches:
      - main
      - release/rc1-integration
  push:
    branches:
      - fix/integration-readiness
      - release/rc1-integration

permissions:
  contents: read

# Diagnostic runner pin: ubuntu-latest jobs are currently failing before
# "Set up job" executes. Pinning the known stable 22.04 image lets us determine
# whether runner-image assignment is the blocker without weakening validation.
jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build production application
        run: npm run build
