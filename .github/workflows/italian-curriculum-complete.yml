name: Complete Italian curriculum translation
on:
  push:
    branches: [fix/italian-curriculum-complete]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/italian-curriculum-complete
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add Italian curriculum protocol translations and regression coverage
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/locales/it.json')
          data=json.loads(p.read_text())
          data.update({
            'curriculum.trackLabel':'Percorso',
            'curriculum.tab.overview':'Panoramica',
            'curriculum.tab.lessons':'Lezioni',
            'curriculum.tab.caseStudies':'Casi di studio',
            'curriculum.tab.resources':'Risorse',
            'curriculum.tab.flashcards':'Schede didattiche',
            'curriculum.whatYouLearn.title':'Cosa imparerai',
            'curriculum.whatYouLearn.body':'Sviluppa le tue conoscenze attraverso cinque livelli strutturati, quindi applicale a decisioni finanziarie sempre più realistiche. Il tuo abbonamento determina i livelli disponibili, mentre i livelli precedenti rimangono accessibili per il ripasso.',
            'curriculum.realWorldFocus.title':'Applicazione nel mondo reale',
            'curriculum.realWorldFocus.body':'Impara i concetti nel loro contesto e fai pratica applicandoli alle decisioni, senza promesse, previsioni o consulenza personalizzata sugli investimenti.',
            'curriculum.lessonsCurrentlyAvailable':'{{count}} lezioni attualmente disponibili',
            'curriculum.levelLabel':'Livello {{level}}',
            'curriculum.level1.name':'Alfabetizzazione finanziaria',
            'curriculum.level2.name':'Competenza finanziaria',
            'curriculum.level3.name':'Ragionamento applicato',
            'curriculum.level4.name':'Integrazione strategica',
            'curriculum.level5.name':'Intelligenza finanziaria',
            'curriculum.lessonsAvailable':'{{count}} lezioni disponibili',
            'curriculum.inDevelopment':'Programma in fase di sviluppo',
            'curriculum.previewLessons':'Anteprima / apri lezioni →',
            'curriculum.openLevel':'Apri livello →'
          })
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          t=Path('scripts/international/tests/curriculum-track-i18n.test.ts')
          s=t.read_text()
          marker='describe("curriculum track i18n coverage", () => {'
          if marker not in s:
              raise SystemExit('Expected curriculum i18n test suite not found')
          insert='''\n  it("includes complete Italian curriculum track UI translations", () => {\n    const italian = JSON.parse(readFileSync(join(process.cwd(), "src/locales/it.json"), "utf8")) as Record<string, string>;\n    const required = [\n      "curriculum.trackLabel", "curriculum.tab.overview", "curriculum.tab.lessons",\n      "curriculum.tab.caseStudies", "curriculum.tab.resources", "curriculum.tab.flashcards",\n      "curriculum.whatYouLearn.title", "curriculum.whatYouLearn.body",\n      "curriculum.realWorldFocus.title", "curriculum.realWorldFocus.body",\n      "curriculum.lessonsCurrentlyAvailable", "curriculum.levelLabel",\n      "curriculum.level1.name", "curriculum.level2.name", "curriculum.level3.name",\n      "curriculum.level4.name", "curriculum.level5.name", "curriculum.lessonsAvailable",\n      "curriculum.inDevelopment", "curriculum.previewLessons", "curriculum.openLevel"\n    ];\n    for (const key of required) {\n      expect(italian[key], `missing Italian translation: ${key}`).toBeTruthy();\n      expect(italian[key]).not.toBe(key);\n    }\n  });\n'''
          s=s.replace(marker,marker+insert,1)
          t.write_text(s)
          PY
      - name: Validate
        run: |
          npm ci
          npm run typecheck
          npm test -- --runInBand
      - name: Commit validated fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/locales/it.json scripts/international/tests/curriculum-track-i18n.test.ts
          git rm .github/workflows/italian-curriculum-complete.yml
          git commit -m "Complete Italian curriculum translations"
          git push origin HEAD:fix/italian-curriculum-complete
