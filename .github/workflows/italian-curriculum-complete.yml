name: Complete Italian curriculum translation
on:
  push:
    branches: [fix/italian-curriculum-complete]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/italian-curriculum-complete
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add Italian curriculum translations
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/locales/it.json'); data=json.loads(p.read_text())
          data.update({'curriculum.trackLabel':'Percorso','curriculum.tab.overview':'Panoramica','curriculum.tab.lessons':'Lezioni','curriculum.tab.caseStudies':'Casi di studio','curriculum.tab.resources':'Risorse','curriculum.tab.flashcards':'Schede didattiche','curriculum.whatYouLearn.title':'Cosa imparerai','curriculum.whatYouLearn.body':'Sviluppa le tue conoscenze attraverso cinque livelli strutturati, quindi applicale a decisioni finanziarie sempre più realistiche. Il tuo abbonamento determina i livelli disponibili, mentre i livelli precedenti rimangono accessibili per il ripasso.','curriculum.realWorldFocus.title':'Applicazione nel mondo reale','curriculum.realWorldFocus.body':'Impara i concetti nel loro contesto e fai pratica applicandoli alle decisioni, senza promesse, previsioni o consulenza personalizzata sugli investimenti.','curriculum.lessonsCurrentlyAvailable':'{{count}} lezioni attualmente disponibili','curriculum.levelLabel':'Livello {{level}}','curriculum.level1.name':'Alfabetizzazione finanziaria','curriculum.level2.name':'Competenza finanziaria','curriculum.level3.name':'Ragionamento applicato','curriculum.level4.name':'Integrazione strategica','curriculum.level5.name':'Intelligenza finanziaria','curriculum.lessonsAvailable':'{{count}} lezioni disponibili','curriculum.inDevelopment':'Programma in fase di sviluppo','curriculum.previewLessons':'Anteprima / apri lezioni →','curriculum.openLevel':'Apri livello →'})
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          t=Path('scripts/international/tests/curriculum-track-i18n.test.ts'); s=t.read_text()
          anchor='const trackPage = readFileSync(join(ROOT, "src", "app", "(public)", "curriculum", "[track]", "page.tsx"), "utf8");'
          if anchor not in s: raise SystemExit('TrackPage test anchor missing')
          s=s.replace(anchor,anchor+'\nconst italian = JSON.parse(readFileSync(join(ROOT, "src", "locales", "it.json"), "utf8")) as Record<string, string>;',1)
          s+='''\n\ntest("Italian curriculum track UI contains every key used by TrackPage", () => {\n  const required = ["curriculum.trackLabel","curriculum.tab.overview","curriculum.tab.lessons","curriculum.tab.caseStudies","curriculum.tab.resources","curriculum.tab.flashcards","curriculum.whatYouLearn.title","curriculum.whatYouLearn.body","curriculum.realWorldFocus.title","curriculum.realWorldFocus.body","curriculum.lessonsCurrentlyAvailable","curriculum.lessonsAvailable","curriculum.levelLabel","curriculum.level1.name","curriculum.level2.name","curriculum.level3.name","curriculum.level4.name","curriculum.level5.name","curriculum.previewLessons","curriculum.openLevel","curriculum.inDevelopment"];\n  const missing = required.filter((key) => !(key in italian) || !italian[key]);\n  assert.deepEqual(missing, [], `Missing Italian TrackPage keys: ${missing.join(", ")}`);\n  for (const key of required) assert.notEqual(italian[key], key, `${key} must be translated in Italian`);\n});\n'''
          t.write_text(s)
          PY
      - name: Validate end to end build
        run: |
          npm ci
          npm run typecheck
          npm test -- --runInBand
          npm run build
      - name: Commit validated fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/locales/it.json scripts/international/tests/curriculum-track-i18n.test.ts
          git rm .github/workflows/italian-curriculum-complete.yml
          git commit -m "Complete Italian curriculum translations"
          git push origin HEAD:fix/italian-curriculum-complete
