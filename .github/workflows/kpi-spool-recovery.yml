name: KPI spool recovery (manual)

# Q1 — replays KPI events that were saved to the Netlify Blobs fallback spool
# while the database was unavailable. Manual only: there is no schedule.
#
#   status   read-only count of waiting events
#   recover  one bounded batch (1-100). Production refuses with HTTP 409 unless
#            KPI_SPOOL_REPLAY_ENABLED=true and KPI_REPLAY_MIGRATION_APPLIED=true.
#
# Each replayed event carries a unique replay key, so repeating a batch can
# never create duplicate rows; failed events stay in the spool for retry.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: status | recover
        required: true
        default: status
        type: choice
        options: [status, recover]
      limit:
        description: recover only - events per batch (1-100)
        required: false
        default: "25"
        type: string

permissions:
  contents: read

concurrency:
  group: kpi-spool-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Call protected recovery endpoint
        env:
          MODE: ${{ inputs.mode }}
          LIMIT: ${{ inputs.limit }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if ! [[ "$LIMIT" =~ ^[0-9]{1,3}$ ]] || [ "$LIMIT" -lt 1 ] || [ "$LIMIT" -gt 100 ]; then echo "::error::limit must be 1-100"; exit 2; fi
          token=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --get --data-urlencode "audience=https://edunancial.com/api/admin" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r '.value // empty')
          if [ -z "$token" ]; then echo "::error::Could not obtain a GitHub OIDC token."; exit 1; fi
          echo "::add-mask::$token"
          url="https://edunancial.com/api/admin/kpi/spool-recovery"
          if [ "$MODE" = "recover" ]; then method=POST; url="$url?limit=$LIMIT"; else method=GET; fi
          code=$(curl -sS -o result.json -w '%{http_code}' -X "$method" "$url" -H "Authorization: Bearer $token" -H "X-GitHub-Run-Id: $RUN_ID")
          cat result.json; echo
          { echo "### KPI spool $MODE (HTTP $code)"; echo '```json'; cat result.json; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=KPI spool $MODE (HTTP $code)::$(tr -d '\n' < result.json)"
          [ "$code" = "200" ] || exit 1
