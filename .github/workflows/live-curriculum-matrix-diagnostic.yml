name: Live Curriculum Matrix Diagnostic

on:
  push:
    branches:
      - diagnostic/live-curriculum-matrix

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare every live locale against English
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const baseUrl="https://www.edunancial.com";
          const locales=["en-US","en-GB","es-419","es-Caribbean","es-ES","fr-CA","fr-FR","pt-BR","pt-PT","de","it","nl","ht"];
          const tracks=["RED","WHITE","BLUE","GREEN","GOLD","PURPLE","ORANGE","BLACK"];
          const levels=[1,2,3];

          async function fetchCatalog(locale){
            const url=baseUrl+"/api/public/curriculum/catalog?lang="+encodeURIComponent(locale);
            const r=await fetch(url,{redirect:"follow",signal:AbortSignal.timeout(60000),headers:{"user-agent":"EdunancialLiveMatrix/3.0"}});
            const text=await r.text();
            if(!r.ok) throw new Error("HTTP "+r.status+": "+text.slice(0,200));
            return JSON.parse(text);
          }

          const catalogs={};
          await Promise.all(locales.map(async locale=>{
            try{catalogs[locale]={ok:true,payload:await fetchCatalog(locale)};}
            catch(e){catalogs[locale]={ok:false,error:String(e?.message||e)};}
          }));

          const english=catalogs["en-US"]?.payload?.lessons||{};
          const report={generatedAt:new Date().toISOString(),baseUrl,locales:{}};

          for(const locale of locales){
            const src=catalogs[locale];
            if(!src?.ok){report.locales[locale]={fetch:"ERROR",error:src?.error||"unknown"};continue;}
            const lessons=src.payload?.lessons||{};
            const matrix={};
            for(const track of tracks){
              matrix[track]={};
              for(const level of levels){
                const rows=[];
                for(let n=1;n<=50;n++){
                  const id=track+"-L"+level+"-"+String(n).padStart(3,"0");
                  rows.push({
                    id,
                    live:lessons[id]?.title??null,
                    english:english[id]?.title??null
                  });
                }
                const liveCount=rows.filter(x=>x.live!==null).length;
                const localizedTitleCount=locale==="en-US"
                  ? liveCount
                  : rows.filter(x=>x.live!==null&&x.english!==null&&x.live!==x.english).length;
                const fallbackEnglishCount=locale==="en-US"
                  ? 0
                  : rows.filter(x=>x.live!==null&&x.english!==null&&x.live===x.english).length;
                const missingIds=rows.filter(x=>x.live===null).map(x=>x.id);
                const status=locale==="en-US"
                  ? (liveCount===50?"COMPLETE":"PARTIAL")
                  : localizedTitleCount===50?"LOCALIZED_50"
                  : localizedTitleCount===0&&liveCount===50?"ENGLISH_FALLBACK_50"
                  : "PARTIAL_LOCALIZATION";
                matrix[track]["L"+level]={status,liveCount,localizedTitleCount,fallbackEnglishCount,missingIds};
              }
            }
            report.locales[locale]={fetch:"OK",resolvedLanguage:src.payload?.language??null,matrix};
          }

          fs.writeFileSync("live-curriculum-matrix.json",JSON.stringify(report,null,2));
          const lines=["# Live Curriculum Matrix","",`Generated: ${report.generatedAt}`,""];
          for(const locale of locales){
            const e=report.locales[locale];
            lines.push("## "+locale);
            if(e.fetch!=="OK"){lines.push("FETCH ERROR: "+e.error,"");continue;}
            lines.push("Resolved language: "+e.resolvedLanguage);
            lines.push("| Track | L1 | L2 | L3 |");
            lines.push("|---|---|---|---|");
            for(const track of tracks){
              const fmt=x=>`${x.status} live=${x.liveCount}/50 translatedTitles=${x.localizedTitleCount}/50 englishFallback=${x.fallbackEnglishCount}/50`;
              lines.push(`| ${track} | ${fmt(e.matrix[track].L1)} | ${fmt(e.matrix[track].L2)} | ${fmt(e.matrix[track].L3)} |`);
            }
            lines.push("");
          }
          fs.writeFileSync("live-curriculum-matrix.md",lines.join("\n"));
          console.log(lines.join("\n"));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: live-curriculum-matrix
          path: |
            live-curriculum-matrix.json
            live-curriculum-matrix.md

# rerun after PR 1048 production deploy
