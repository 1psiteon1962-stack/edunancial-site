name: Manual Neon KPI Events Migration

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type APPLY_KPI_EVENTS to apply the production migration"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: neon-kpi-events-production-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ inputs.confirm == 'APPLY_KPI_EVENTS' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Require production database URL
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}" || { echo "DATABASE_URL is not configured in the production environment."; exit 1; }
          echo "::add-mask::$DATABASE_URL"
      - name: Install PostgreSQL client
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Apply KPI events migration
        shell: bash
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f db/neon/20261002_kpi_events.sql
      - name: Verify KPI events table
        shell: bash
        run: |
          set -euo pipefail
          test "$(psql "$DATABASE_URL" -X -Atc "select count(*) from information_schema.tables where table_schema='public' and table_name='kpi_events';")" = "1"
