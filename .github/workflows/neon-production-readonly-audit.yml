name: Neon Production Read-Only Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-production-readonly-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit production Neon without writes
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Require protected production database URL
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}" || { echo "DATABASE_URL is not configured in the production environment."; exit 1; }
          echo "::add-mask::$DATABASE_URL"

      - name: Install PostgreSQL client
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Verify connection and expected tables read-only
        shell: bash
        run: |
          set -euo pipefail
          export PGOPTIONS="-c default_transaction_read_only=on"
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          begin read only;

          select current_database() as database_name,
                 current_user as database_user,
                 current_setting('transaction_read_only') as transaction_read_only,
                 version() as postgres_version;

          with expected(table_name) as (
            values
              ('payment_catalog_items'),
              ('orders'),
              ('webhook_events'),
              ('user_lesson_progress'),
              ('user_track_progress'),
              ('course_progress'),
              ('user_applied_learning_decisions'),
              ('user_competency_evidence'),
              ('video_r2_projects'),
              ('video_r2_assets'),
              ('video_r2_scenes'),
              ('video_r2_audio'),
              ('video_r2_jobs')
          )
          select e.table_name,
                 case when t.table_name is null then 'MISSING' else 'PRESENT' end as status
          from expected e
          left join information_schema.tables t
            on t.table_schema = 'public'
           and t.table_name = e.table_name
          order by e.table_name;

          select table_name,
                 (xpath('/row/c/text()', query_to_xml(format('select count(*) as c from public.%I', table_name), false, true, '')))[1]::text::bigint as row_count
          from information_schema.tables
          where table_schema = 'public'
            and table_name in (
              'payment_catalog_items','orders','webhook_events',
              'user_lesson_progress','user_track_progress','course_progress',
              'user_applied_learning_decisions','user_competency_evidence',
              'video_r2_projects','video_r2_assets','video_r2_scenes','video_r2_audio','video_r2_jobs'
            )
          order by table_name;

          rollback;
          SQL
