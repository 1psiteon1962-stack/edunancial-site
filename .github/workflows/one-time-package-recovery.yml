name: One-time package-scoped curriculum recovery

on:
  push:
    branches:
      - main
    paths:
      - "src/app/api/admin/content/upload/recover-next/route.ts"
      - ".github/workflows/one-time-package-recovery.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  # Signed GitHub OIDC identity; the endpoint verifies repository, branch and workflow file.
  id-token: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Recover stored curriculum packages one at a time
        shell: bash
        env:
          GH_RUN_ID: ${{ github.run_id }}
          OIDC_AUDIENCE: https://edunancial.com/api/admin
        run: |
          set -euo pipefail
          # A fresh short-lived OIDC token is requested for every call, so long runs never use an expired one.
          oidc_token() {
            local token
            token=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              --get --data-urlencode "audience=$OIDC_AUDIENCE" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r '.value // empty')
            if [ -z "$token" ]; then echo "::error::Could not obtain a GitHub OIDC token (id-token: write required)." >&2; return 1; fi
            printf '%s' "$token"
          }
          endpoint="https://edunancial.com/api/admin/content/upload/recover-next"

          for attempt in $(seq 1 80); do
            token=$(oidc_token)
            echo "::add-mask::$token"
            code=$(curl -sS -o recovery.json -w '%{http_code}' -X POST "$endpoint" \
              -H "Authorization: Bearer $token" \
              -H "X-GitHub-Run-Id: $GH_RUN_ID" || true)

            if [ "$code" = "404" ] || [ "$code" = "502" ] || [ "$code" = "503" ] || [ "$code" = "504" ]; then
              echo "Recovery endpoint not ready yet (HTTP $code), attempt $attempt/80."
              sleep 15
              continue
            fi

            cat recovery.json
            echo

            if [ "$code" != "200" ]; then
              echo "Recovery stopped on HTTP $code."
              exit 1
            fi

            done_value=$(jq -r '.done // false' recovery.json)
            processed=$(jq -r '.processed // 0' recovery.json)
            remaining=$(jq -r '.remainingEligible // 0' recovery.json)

            echo "processed=$processed remainingEligible=$remaining done=$done_value"

            if [ "$done_value" = "true" ]; then
              echo "Stored-package recovery is complete."
              exit 0
            fi

            if [ "$processed" != "1" ]; then
              echo "Recovery made no forward progress."
              exit 1
            fi

            sleep 3
          done

          echo "Recovery did not complete within the bounded run."
          exit 1
