name: One-time recover stored curriculum

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-recover-stored-curriculum.yml'
      - 'src/app/api/admin/content/upload/recover-all/route.ts'

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Execute stored-package recovery
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          url="https://edunancial.com/api/admin/content/upload/recover-all"
          for attempt in $(seq 1 24); do
            code=$(curl -sS -o recovery.json -w '%{http_code}' -X POST "$url" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Repository: $GH_REPOSITORY" \
              -H "X-GitHub-Run-Id: $GH_RUN_ID" || true)
            if [ "$code" = "200" ] || [ "$code" = "207" ]; then
              cat recovery.json
              test "$code" = "200"
              exit $?
            fi
            sleep 15
          done
          echo "Production recovery endpoint did not become available in time."
          cat recovery.json || true
          exit 1
