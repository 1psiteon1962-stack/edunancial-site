name: PR297 Regenerate Curriculum Artifacts Once

on:
  push:
    branches:
      - copilot/contentcourse-upload-20260813-094648-august-conten

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: copilot/contentcourse-upload-20260813-094648-august-conten
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate curriculum audit and inventory
        run: |
          npm run curriculum:audit
          npm run curriculum:inventory

      - name: Remove one-time workflow and commit deterministic artifacts
        run: |
          rm -f .github/workflows/pr297-regenerate-artifacts-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add curriculum/inventory.json curriculum/reports/CURRICULUM-AUDIT.json curriculum/reports/CURRICULUM-AUDIT.md .github/workflows/pr297-regenerate-artifacts-once.yml
          if git diff --cached --quiet; then
            echo "No generated artifact changes to commit."
            exit 0
          fi
          git commit -m "fix(ci): commit deterministic curriculum artifacts"
          git push origin HEAD:copilot/contentcourse-upload-20260813-094648-august-conten
