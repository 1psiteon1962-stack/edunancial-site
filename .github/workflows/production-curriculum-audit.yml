name: Production curriculum audit (learner path)

# Read-only. Proves what paying customers can retrieve, coordinate by coordinate,
# and fails if any coordinate that previously passed has stopped passing.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 13 * * *"   # daily
  workflow_dispatch:
    inputs:
      levels:
        description: "Levels to audit (comma list, blank = all)"
        required: false
      update_baseline:
        description: "Add newly passing coordinates to the baseline artifact"
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: production-curriculum-audit
  cancel-in-progress: false

jobs:
  backup:
    # Neon-only export is not an independent production Blob backup.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export Neon curriculum tables (read-only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -uo pipefail
          mkdir -p backup/neon
          printf '%s\n' 'NEON ONLY: Not a Blob backup; Git/Blob-only lessons not protected.' > backup/BACKUP_SCOPE.txt
          status=backup/NEON_EXPORT_STATUS.txt
          echo "run_id=$GITHUB_RUN_ID sha=$GITHUB_SHA" > "$status"
          if [ -z "$DATABASE_URL" ]; then
            echo 'FAILED: DATABASE_URL secret missing' >> "$status"
            echo '::error::Neon-only export was not performed'
            exit 1
          fi
          sudo apt-get -qq update && sudo apt-get -qq install -y postgresql-client >/dev/null
          failed=0
          for t in published_lessons published_translations curriculum_uploads; do
            out="backup/neon/$t.csv"
            if psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "\\copy (select * from $t) to '$out' with csv header"; then
              rows=$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -At -c "select count(*) from $t" 2>/dev/null || echo "?")
              checksum=$(sha256sum "$out" | cut -d' ' -f1)
              echo "$t exported rows=$rows sha256=$checksum" >> "$status"
              if [ "$rows" = "0" ]; then echo "::warning::$t has zero rows; not evidence that lessons are absent."; fi
              if [ "$rows" = "?" ]; then failed=1; echo "::error::Could not verify rows for $t"; fi
            else
              echo "$t FAILED" >> "$status"
              echo "::error::Neon export failed for $t"
              failed=1
            fi
          done
          if [ "$failed" -eq 0 ]; then echo 'RESULT: Neon-only export completed; Blob preservation unresolved' >> "$status"
          else echo 'RESULT: INCOMPLETE Neon export' >> "$status"; fi
          exit "$failed"
      - name: Upload Neon export evidence (also on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-only-export-${{ github.run_id }}
          path: backup/
          retention-days: 90
          if-no-files-found: error

  audit:
    needs: backup
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # id-token: write lets this job request signed GitHub OIDC identity tokens,
    # which the production endpoint verifies cryptographically (repo, branch, workflow).
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for this commit to be live (push only)
        if: github.event_name == 'push'
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          OIDC_AUDIENCE: https://edunancial.com/api/admin
        run: |
          set -uo pipefail
          for i in $(seq 1 30); do
            # Fresh short-lived OIDC token per probe; never echoed.
            token=$(curl --connect-timeout 5 --max-time 15 --retry 0 -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              --get --data-urlencode "audience=$OIDC_AUDIENCE" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r '.value // empty')
            if [ -z "$token" ]; then echo "::error::Could not obtain a GitHub OIDC token (id-token: write required)."; exit 1; fi
            echo "::add-mask::$token"
            live=$(curl --connect-timeout 5 --max-time 20 --retry 0 -sSf "https://edunancial.com/api/admin/curriculum/production-audit?tracks=RED&levels=1&locales=en-US" \
              -H "Authorization: Bearer $token" -H "X-GitHub-Run-Id: $RUN_ID" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).meta.deployCommit??"")}catch{console.log("")}})')
            if [ "$live" = "$EXPECTED_SHA" ]; then echo "deploy live"; exit 0; fi
            echo "waiting for deploy ($live)"; sleep 30
          done
          echo "::error::Requested commit not confirmed live after 15 minutes; refuse to audit stale production as this commit."
          exit 1
      - name: Audit every coordinate through the learner resolver
        env:
          # Dispatch inputs are data, never shell source: they arrive only as env vars.
          LEVELS_INPUT: ${{ inputs.levels }}
          UPDATE_BASELINE_INPUT: ${{ inputs.update_baseline }}
          EDUNANCIAL_GITHUB_OIDC_AUDIENCE: https://edunancial.com/api/admin
          # Push runs verify one exact commit: every response must come from that deployment.
          EXPECTED_DEPLOY_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${LEVELS_INPUT:-}" ]; then
            if ! [[ "$LEVELS_INPUT" =~ ^[1-5](,[1-5])*$ ]]; then
              echo "::error::Invalid levels input. Use a comma list of 1-5 (for example 1 or 1,3), or leave blank for all levels."
              exit 2
            fi
            args+=(--levels "$LEVELS_INPUT")
          fi
          if [ "${UPDATE_BASELINE_INPUT:-false}" = "true" ]; then args+=(--update-baseline); fi
          # The script re-validates every argument and exits 2 before any network call if malformed.
          node scripts/curriculum/production-audit.mjs "${args[@]}"
      - name: Publish report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-curriculum-audit
          path: |
            reports/production-audit/
            curriculum/verification/production-baseline.json
          if-no-files-found: warn
      - name: Job summary
        if: always()
        run: |
          { echo '```'; cat reports/production-audit/level1-matrix.txt 2>/dev/null; echo; grep -E ' FAIL' reports/production-audit/audit-matrix.txt 2>/dev/null | head -80; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  raise-floor:
    # Protected floor only rises: when the audit proves new coordinates PASS,
    # open (or refresh) one pull request adding them to the floor. Never removes.
    needs: audit
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: production-curriculum-audit
          path: audit-artifact
        continue-on-error: true
      - name: Open floor-raise pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          proposed=audit-artifact/reports/production-audit/proposed-baseline.json
          floor=curriculum/verification/production-baseline.json
          if [ ! -f "$proposed" ]; then echo "No newly passing coordinates."; exit 0; fi
          # Refuse anything that is not a strict superset of the current floor.
          node -e '
            const fs=require("fs");
            const [floorPath, proposedPath]=process.argv.slice(1);
            const old=fs.existsSync(floorPath)?JSON.parse(fs.readFileSync(floorPath,"utf8")).coordinates:[];
            const next=JSON.parse(fs.readFileSync(proposedPath,"utf8")).coordinates;
            const key=/^[A-Z]+:L[1-5]:[A-Za-z]{2,3}(-[A-Za-z0-9]+)*$/;
            if(!Array.isArray(next)||next.some(c=>!key.test(c)))throw new Error("malformed proposed floor");
            const missing=old.filter(c=>!next.includes(c));
            if(missing.length)throw new Error("proposed floor would remove: "+missing.join(", "));
            if(next.length<=old.length){console.log("Floor unchanged.");process.exit(3);}
            console.log(`Floor ${old.length} -> ${next.length}`);
          ' "$floor" "$proposed" || { code=$?; [ "$code" = 3 ] && exit 0; exit "$code"; }
          cp "$proposed" "$floor"
          branch=automation/raise-audit-floor
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add "$floor"
          git commit -m "chore(audit): raise protected curriculum floor" -m "Coordinates newly proven PASS in production by $RUN_URL. The floor only grows."
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')" ]; then
            gh pr create --head "$branch" --base main --title "chore(audit): raise protected curriculum floor" \
              --body "Adds coordinates newly proven PASS in production ($RUN_URL) to curriculum/verification/production-baseline.json. The floor only grows; this PR never removes a coordinate."
          fi
