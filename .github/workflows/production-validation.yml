name: Production Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Detect localization-impacting changes
        id: localization_changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf 'Changed files:\n%s\n' "$changed_files"
          gate_files="$(
            printf '%s\n' "$changed_files" \
              | grep -E '^(content/curriculum/|curriculum/|scripts/(curriculum|international)/)|^\.github/workflows/complete-italian-l1\.yml$|^package(-lock)?\.json
          )"
          if [ -n "$gate_files" ]; then
            echo "should_run_gate=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run_gate=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate localization manifest
        run: npm run curriculum:localization:global

      - name: Enforce complete Level 1 localization
        if: github.event_name != 'pull_request' || steps.localization_changes.outputs.should_run_gate == 'true'
        run: npm run curriculum:localization:l1-gate

      - name: Build
        run: npm run build
