name: Repair GREEN L2 registry

on:
  push:
    branches:
      - green-l2-repair-current-main
    paths:
      - '.github/workflows/repair-green-l2-registry.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: green-l2-repair-current-main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Register GREEN L2 from current filesystem
        run: npm run curriculum:import -- content/curriculum/GREEN/L2
      - name: Refresh curriculum audit artifacts
        run: npm run curriculum:audit
      - name: Remove one-time repair workflow
        run: rm .github/workflows/repair-green-l2-registry.yml
      - name: Commit generated registry and audit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add curriculum content/curriculum/GREEN/L2 .github/workflows/repair-green-l2-registry.yml
          git commit -m "Register GREEN L2 and refresh curriculum audit"
          git push origin HEAD:green-l2-repair-current-main
