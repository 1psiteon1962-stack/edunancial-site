name: Temporary BLUE Reconciliation

on:
  push:
    branches:
      - recover/blue-l1-after-white

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recover/blue-l1-after-white
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Canonicalize recovered BLUE English lessons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p content/curriculum/BLUE/L1
          for f in content/courses/blue/level-1/en/*.md; do
            id=$(sed -n 's/^id:[[:space:]]*//p' "$f" | head -1 | tr -d '\r"')
            if [[ ! "$id" =~ ^BLUE-L1-[0-9]{3}$ ]]; then
              id=$(sed -n 's/^\*\*Lesson ID:\*\*[[:space:]]*//p' "$f" | head -1 | tr -d '\r')
            fi
            [[ "$id" =~ ^BLUE-L1-[0-9]{3}$ ]] || continue
            dest="content/curriculum/BLUE/L1/${id}.md"
            cp "$f" "$dest"
            if ! head -1 "$dest" | grep -qx -- '---'; then
              number=$((10#${id##*-}))
              title=$(head -1 "$dest" | sed -E "s/^# ${id}:[[:space:]]*//" | sed 's/"/\\"/g')
              tmp=$(mktemp)
              cat > "$tmp" <<EOF
---
id: ${id}
track: BLUE
officialTrackName: Business
level: 1
lessonNumber: ${number}
title: "${title}"
version: "1.0"
author: Waldemar M. Caban, JD MA
date: 2026-08-08
---

EOF
              cat "$dest" >> "$tmp"
              mv "$tmp" "$dest"
            fi
            sed -i '0,/^## Main Lesson$/s//## Core Content/' "$dest"
          done
          test "$(find content/curriculum/BLUE/L1 -maxdepth 1 -name 'BLUE-L1-*.md' | wc -l)" -eq 50
      - name: Register BLUE with current importer
        run: npm run curriculum:import -- content/curriculum/BLUE/L1
      - run: npm run curriculum:audit
      - run: npm run curriculum:inventory
      - name: Commit reconciled BLUE state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add content/curriculum/BLUE/L1 curriculum/registry.json curriculum/ingestion-ledger.json curriculum/inventory.json curriculum/reports
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Reconcile BLUE Level 1 with current curriculum registry"
          git push origin HEAD:recover/blue-l1-after-white
