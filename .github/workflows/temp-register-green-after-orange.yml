name: Temporary Register GREEN After ORANGE

on:
  push:
    branches:
      - recover/green-l1-after-orange

permissions:
  contents: write

jobs:
  register:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recover/green-l1-after-orange
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Register GREEN against current ORANGE main metadata
        run: npm run curriculum:import -- content/curriculum/GREEN/L1
      - name: Regenerate audit and inventory
        run: |
          npm run curriculum:audit
          npm run curriculum:inventory
      - name: Commit combined metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add curriculum/registry.json curriculum/ingestion-ledger.json curriculum/inventory.json curriculum/reports
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Register GREEN curriculum after ORANGE merge"
          git push origin HEAD:recover/green-l1-after-orange
