name: Temporary Register ORANGE Curriculum

on:
  push:
    branches:
      - recover/orange-l1-current-main

permissions:
  contents: write

jobs:
  register:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v4
        with:
          ref: recover/orange-l1-current-main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Register recovered ORANGE lessons using current importer
        run: npm run curriculum:import -- content/curriculum/ORANGE/L1

      - name: Regenerate audit and inventory
        run: |
          npm run curriculum:audit
          npm run curriculum:inventory

      - name: Commit generated curriculum metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add curriculum/registry.json curriculum/ingestion-ledger.json curriculum/inventory.json curriculum/reports
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Register recovered ORANGE Level 1 curriculum"
          git push origin HEAD:recover/orange-l1-current-main
