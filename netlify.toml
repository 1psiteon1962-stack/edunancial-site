# ============================================================
# DEPLOYMENT TARGET: Edunancial production Netlify project
# Canonical URL: https://edunancial.com
#
# This repository must be connected to ONLY the Edunancial
# production Netlify site.  If deployments are also appearing
# on a "brilliant-sunflower-*" or any other Netlify site,
# that means the Netlify GitHub App integration is linked to
# more than one Netlify project.
#
# Required Netlify dashboard action to fix multi-site deploys:
#   1. Log in to https://app.netlify.com
#   2. Open the site that should NOT receive deployments
#      (e.g. the "brilliant-sunflower-*" site).
#   3. Go to Site configuration → Build & deploy → Continuous deployment.
#   4. Click "Unlink repository" (or "Disconnect").
#   5. Confirm you want to unlink the 1psiteon1962-stack/edunancial-site repo.
#   6. Verify the production Edunancial site still shows this repo under
#      its own "Build & deploy → Continuous deployment" settings.
#
# There must be exactly ONE Netlify site linked to this repository.
# Preview deploys for pull requests are fine as long as they belong
# to the production Edunancial site, not to a separate project.
# ============================================================

[build]
command = "npm run build"
publish = ".next"

[build.environment]
NODE_VERSION = "22"
NETLIFY_NEXT_PLUGIN_SKIP_FORMS = "true"

[[plugins]]
package = "@netlify/plugin-nextjs"

# Canonical host redirects must preserve request method/body for API calls.
# Using 301/302 here can downgrade POST /api/* requests to GET on redirect,
# which breaks upload endpoints such as /api/admin/content/upload/presign.
[[redirects]]
  from = "http://edunancial.com/*"
  to = "https://edunancial.com/:splat"
  status = 308
  force = true

[[redirects]]
  from = "http://www.edunancial.com/*"
  to = "https://edunancial.com/:splat"
  status = 308
  force = true

[[redirects]]
  from = "https://www.edunancial.com/*"
  to = "https://edunancial.com/:splat"
  status = 308
  force = true

# API routes must never be cached.  A prior 404 response from a misconfigured
# deployment (e.g. a SPA catch-all rewrite) must not be served from the Netlify
# CDN after the routing is fixed.  This [[headers]] block is processed by
# Netlify from netlify.toml directly — it is the most reliable way to apply
# headers regardless of which _headers file is picked up from the publish
# directory.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
